measures:
  - name: total_rows_measure_measure
    display_name: Total Rows
    expression: COUNT(*)
    description: Total number of log records.
    format_preset: humanize
  - name: total_impressions_measure_measure
    display_name: Total Impressions
    expression: SUM(impressions)
    description: Sum of impressions across all records.
    format_preset: humanize
  - name: total_clicks_measure_measure
    display_name: Total Clicks
    expression: SUM(clicks)
    description: Sum of clicks across all records.
    format_preset: humanize
  - name: total_conversions_measure_measure
    display_name: Total Conversions
    expression: SUM(conversions)
    description: Sum of conversions across all records.
    format_preset: humanize
  - name: total_revenue_measure_measure
    display_name: Total Revenue
    expression: SUM(revenue)
    description: Total revenue across all records.
    format_preset: humanize
  - name: total_cost_measure_measure
    display_name: Total Cost
    expression: SUM(cost)
    description: Total cost across all records.
    format_preset: humanize
  - name: avg_revenue_per_row_measure_measure
    display_name: Average Revenue per Row
    expression: AVG(revenue)
    description: Average revenue value per log record.
    format_preset: humanize
  - name: avg_cost_per_row_measure_measure
    display_name: Average Cost per Row
    expression: AVG(cost)
    description: Average cost value per log record.
    format_preset: humanize

