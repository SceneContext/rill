type: model
connector: duckdb

# Incremental + partitioned ingestion: the bucket grows continuously, so we
# never want to re-list/re-read the whole history on every refresh. Each
# dt=/hour=/node= directory becomes one partition; only new/changed
# partitions are (re)ingested on each run.
incremental: true
refresh:
  cron: "0 * * * *" # hourly; tighten/loosen to match how often the bidders flush logs

partitions:
  glob:
    connector: s3
    path: s3://sc-analytics-445214595912/events/dt=*/hour=*/node=ovh-sc-edge-*/*.log.gz
    partition: hive
    last: 48

create_secrets_from_connectors: s3

# Grain of this table is one row per (hour, node, partner, endpoint, source,
# app_bundle, segment), with `segments` deduplicated and unnested per event.
sql: |
  WITH raw AS (
    SELECT
      bundle,
      partner,
      endpoint,
      source,
      scid,
      unnest(list_distinct(segments)) AS segment
    FROM read_json('{{ .partition.uri }}/*.log.gz',
      format = 'newline_delimited',
      compression = 'gzip',
      hive_partitioning = false,
      ignore_errors = true,
      columns = {
        bundle: 'VARCHAR', partner: 'VARCHAR', endpoint: 'VARCHAR', source: 'VARCHAR',
        scid: 'VARCHAR', segments: 'VARCHAR[]'
      })
    WHERE len(segments) > 0
  )
  SELECT
    strptime('{{ .partition.dt }} {{ .partition.hour }}', '%Y-%m-%d %H') AS event_time,
    '{{ .partition.dt }}'::DATE                                          AS event_date,
    '{{ .partition.hour }}'::INT                                         AS event_hour,
    '{{ .partition.node }}'                                              AS node,
    coalesce(partner, 'unknown')                                         AS partner,
    coalesce(endpoint, 'unknown')                                        AS endpoint,
    coalesce(source, 'unknown')                                          AS source,
    bundle                                                               AS app_bundle,
    segment,
    count(*)                                                             AS opportunities,
    count(DISTINCT nullif(scid, ''))                                     AS distinct_content_ids,
    '{{ .partition.dt }}'                                                AS partition_dt,
    '{{ .partition.hour }}'                                              AS partition_hour,
    '{{ .partition.node }}'                                              AS partition_node
  FROM raw
  WHERE segment IS NOT NULL AND segment <> ''
  GROUP BY ALL

output:
  connector: duckdb
