# Model YAML
# Reference documentation: https://docs.rilldata.com/developers/build/connectors/data-source/s3
type: model
materialize: true

create_secrets_from_connectors: s3_dsp
sql: >
  SELECT *
  FROM read_parquet(
    's3://scenecontext-dsp-log-bucket/agency_id=*/advertiser_id=*/campaign_id=*/processed/**/*.parquet',
    hive_partitioning = true,
    union_by_name = true
  )
