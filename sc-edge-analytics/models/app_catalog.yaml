# Materialised copy of the SceneContext app catalog, refreshed daily at 03:05 UTC.
#
# The catalog API is paginated (max 200 per page, 400 rows total as of Oct 2026).
# We always fetch pages 1-10; a model test fires if we see any items on page 10,
# which would mean the catalog outgrew the window.
#
# Authentication: connectors/app_catalog_api.yaml holds the X-App-Catalog-Key header.
# Rill mounts it automatically as a DuckDB HTTP secret (EXTRA_HTTP_HEADERS) scoped to
# campaignapi.scenecontext.io, so it never leaks onto S3 requests.
#
# change_mode: reset is intentional — this is a full snapshot each day. If the
# API is temporarily unavailable the refresh errors out (non-destructive), and
# the previous day's data stays in place.

type: model
connector: duckdb
materialize: true
create_secrets_from_connectors: app_catalog_api

refresh:
  cron: "5 3 * * *"
  time_zone: UTC

# campaignapi.scenecontext.io returns 405 on HEAD requests; without force_download,
# DuckDB < 1.5.6 falls back to a broken Range: bytes=0-1 probe and fails with
# "HTTP 0 Internal Server Error" (duckdb/duckdb#21583, #24981).
pre_exec: |
  SET force_download = true

sql: |
  -- read_json is a table function so each page needs its own FROM clause.
  -- The API returns a JSON object; we select the items array and unnest it.
  -- Pages beyond the last return an empty items array, which unnest skips.
  WITH all_items AS (
    SELECT unnest(items) AS item FROM read_json('https://campaignapi.scenecontext.io/api/v1/service/apps?page=1&page_size=200',
      columns = {items: 'STRUCT(id VARCHAR, name VARCHAR, bundle_id VARCHAR, platform_app_id VARCHAR, platform VARCHAR, publisher VARCHAR, updated_at VARCHAR)[]'},
      field_appearance_threshold = 0)
    UNION ALL
    SELECT unnest(items) AS item FROM read_json('https://campaignapi.scenecontext.io/api/v1/service/apps?page=2&page_size=200',
      columns = {items: 'STRUCT(id VARCHAR, name VARCHAR, bundle_id VARCHAR, platform_app_id VARCHAR, platform VARCHAR, publisher VARCHAR, updated_at VARCHAR)[]'},
      field_appearance_threshold = 0)
    UNION ALL
    SELECT unnest(items) AS item FROM read_json('https://campaignapi.scenecontext.io/api/v1/service/apps?page=3&page_size=200',
      columns = {items: 'STRUCT(id VARCHAR, name VARCHAR, bundle_id VARCHAR, platform_app_id VARCHAR, platform VARCHAR, publisher VARCHAR, updated_at VARCHAR)[]'},
      field_appearance_threshold = 0)
    UNION ALL
    SELECT unnest(items) AS item FROM read_json('https://campaignapi.scenecontext.io/api/v1/service/apps?page=4&page_size=200',
      columns = {items: 'STRUCT(id VARCHAR, name VARCHAR, bundle_id VARCHAR, platform_app_id VARCHAR, platform VARCHAR, publisher VARCHAR, updated_at VARCHAR)[]'},
      field_appearance_threshold = 0)
    UNION ALL
    SELECT unnest(items) AS item FROM read_json('https://campaignapi.scenecontext.io/api/v1/service/apps?page=5&page_size=200',
      columns = {items: 'STRUCT(id VARCHAR, name VARCHAR, bundle_id VARCHAR, platform_app_id VARCHAR, platform VARCHAR, publisher VARCHAR, updated_at VARCHAR)[]'},
      field_appearance_threshold = 0)
    UNION ALL
    SELECT unnest(items) AS item FROM read_json('https://campaignapi.scenecontext.io/api/v1/service/apps?page=6&page_size=200',
      columns = {items: 'STRUCT(id VARCHAR, name VARCHAR, bundle_id VARCHAR, platform_app_id VARCHAR, platform VARCHAR, publisher VARCHAR, updated_at VARCHAR)[]'},
      field_appearance_threshold = 0)
    UNION ALL
    SELECT unnest(items) AS item FROM read_json('https://campaignapi.scenecontext.io/api/v1/service/apps?page=7&page_size=200',
      columns = {items: 'STRUCT(id VARCHAR, name VARCHAR, bundle_id VARCHAR, platform_app_id VARCHAR, platform VARCHAR, publisher VARCHAR, updated_at VARCHAR)[]'},
      field_appearance_threshold = 0)
    UNION ALL
    SELECT unnest(items) AS item FROM read_json('https://campaignapi.scenecontext.io/api/v1/service/apps?page=8&page_size=200',
      columns = {items: 'STRUCT(id VARCHAR, name VARCHAR, bundle_id VARCHAR, platform_app_id VARCHAR, platform VARCHAR, publisher VARCHAR, updated_at VARCHAR)[]'},
      field_appearance_threshold = 0)
    UNION ALL
    SELECT unnest(items) AS item FROM read_json('https://campaignapi.scenecontext.io/api/v1/service/apps?page=9&page_size=200',
      columns = {items: 'STRUCT(id VARCHAR, name VARCHAR, bundle_id VARCHAR, platform_app_id VARCHAR, platform VARCHAR, publisher VARCHAR, updated_at VARCHAR)[]'},
      field_appearance_threshold = 0)
    UNION ALL
    SELECT unnest(items) AS item FROM read_json('https://campaignapi.scenecontext.io/api/v1/service/apps?page=10&page_size=200',
      columns = {items: 'STRUCT(id VARCHAR, name VARCHAR, bundle_id VARCHAR, platform_app_id VARCHAR, platform VARCHAR, publisher VARCHAR, updated_at VARCHAR)[]'},
      field_appearance_threshold = 0)
  )
  SELECT
    item.id              AS catalog_id,
    item.name            AS app_name,
    item.bundle_id       AS bundle_id,
    item.platform_app_id AS platform_app_id,
    item.platform        AS platform,
    item.publisher       AS publisher,
    item.updated_at::TIMESTAMP AS updated_at
  FROM all_items
  WHERE item.id IS NOT NULL

output:
  connector: duckdb

tests:
  - name: not_empty
    sql: |
      SELECT 1 WHERE (SELECT count(*) FROM app_catalog) = 0
  - name: page_window_not_exhausted
    sql: |
      SELECT count(*) AS n FROM app_catalog HAVING count(*) >= 2000
