compiler: rillv1

display_name: SceneContext Edge Analytics
description: Hourly rollups of live bidder events (requests, resolution, cache, latency, segments)

olap_connector: duckdb

ignore_paths:
  - /scripts

# Default keeps the template valid when APP_CATALOG_KEY is not yet set locally.
# The real key must be present in .env (or passed via --env) before running
# `rill project refresh --model app_catalog`.
env:
  APP_CATALOG_KEY: ""
